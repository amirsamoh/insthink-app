<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>INSTHINK .Coffee</title>

  <!-- ทำให้เปิดแบบเต็มจอเหมือนแอป -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#dde7ee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="INSTHINK">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <!-- เปิดการเชื่อมต่อกับ Google ล่วงหน้า ให้โหลดเร็วขึ้น -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <style>
    :root {
      --navy: #1e3b67; --muted: #8b99a5; --top: #dde7ee; --bottom: #f3f5f7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
      background: var(--top);
      font-family: -apple-system, BlinkMacSystemFont, "IBM Plex Sans Thai", "Segoe UI", sans-serif;
    }
    /* เว้นพื้นที่รอยบาก/แถบสถานะด้านบน และแถบโฮมด้านล่างของ iPhone */
    .shell {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
      background: linear-gradient(180deg, var(--top) 0%, var(--bottom) 100%);
    }
    .shell::after { content: ''; height: env(safe-area-inset-bottom); background: var(--bottom); flex: none; }
    iframe { flex: 1; width: 100%; border: 0; display: block; background: transparent; }

    /* หน้าจอโหลด */
    .splash {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(180deg, var(--top) 0%, var(--bottom) 100%);
      transition: opacity .35s ease, visibility .35s;
    }
    .splash.hide { opacity: 0; visibility: hidden; }
    .splash img { width: 180px; height: auto; }
    .dots { display: flex; gap: 8px; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--navy); opacity: .25; animation: d 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes d { 0%, 80%, 100% { opacity: .25; transform: scale(1); } 40% { opacity: 1; transform: scale(1.25); } }
    .msg { display: none; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.6; padding: 0 32px; }
    .msg b { color: var(--navy); }
    .btn {
      display: none; border: 0; border-radius: 999px; background: var(--navy); color: #fff;
      font: inherit; font-size: 16px; padding: 12px 28px; cursor: pointer;
    }
    .splash.error .dots { display: none; }
    .splash.error .msg, .splash.error .btn { display: block; }
  </style>
</head>
<body>
  <div class="shell">
    <iframe id="app" title="INSTHINK .Coffee" allow="clipboard-write; web-share"></iframe>
  </div>

  <div class="splash" id="splash">
    <img src="logo.png" alt="INSTHINK .Coffee">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="retry" type="button">ลองใหม่</button>
  </div>

  <!-- ลิงก์แอปอยู่ในไฟล์ config.js (แยกไว้ อัปเดตแอปแล้วลิงก์ไม่หาย) -->
  <script src="config.js"></script>
  <script>
    // อ่านลิงก์จาก config.js แล้วทำความสะอาด (ตัดเว้นวรรค/เครื่องหมายคำพูดที่เผลอติดมา)
    const RAW_URL = String(window.GAS_URL || '');
    let GAS_URL = RAW_URL.trim().replace(/^['"\s]+|['"\s]+$/g, '');
    if (/^script\.google\.com\//.test(GAS_URL)) GAS_URL = 'https://' + GAS_URL;   // ลืมใส่ https://

    const app = document.getElementById('app');
    const splash = document.getElementById('splash');
    const msg = document.getElementById('msg');
    let slowTimer, afterLoadTimer;

    // ปิดหน้าโหลด + บังคับให้ iPhone วาดหน้าแอปใหม่ (กันอาการต้องแตะจอก่อน)
    function reveal() {
      clearTimeout(slowTimer); clearTimeout(afterLoadTimer);
      if (splash.classList.contains('hide') || splash.classList.contains('error')) return;
      splash.classList.add('hide');
      setTimeout(() => { if (splash.classList.contains('hide')) splash.style.display = 'none'; }, 400);
      app.style.transform = 'translateZ(0)';
      requestAnimationFrame(() => requestAnimationFrame(() => { app.style.transform = ''; }));
    }

    function showError(html) {
      clearTimeout(slowTimer); clearTimeout(afterLoadTimer);
      splash.style.display = '';
      msg.innerHTML = html;
      splash.classList.add('error');
      splash.classList.remove('hide');
    }

    function load() {
      splash.classList.remove('error', 'hide');
      const urlProblem =
        !GAS_URL || GAS_URL.includes('PASTE_YOUR') ? 'ยังไม่ได้ใส่ลิงก์แอปในไฟล์ <b>config.js</b>' :
        !/^https:\/\/script\.google\.com\//.test(GAS_URL) ? 'ลิงก์ต้องขึ้นต้นด้วย <b>https://script.google.com/</b>' :
        /\/dev(\?|$)/.test(GAS_URL) ? 'นี่คือลิงก์ทดสอบ (<b>/dev</b>) ใช้ได้เฉพาะเจ้าของ<br>ให้ใช้ลิงก์ที่ลงท้ายด้วย <b>/exec</b> แทน' :
        !/\/exec(\?|$)/.test(GAS_URL) ? 'ลิงก์ต้องลงท้ายด้วย <b>/exec</b>' : '';
      if (urlProblem) {
        const shown = GAS_URL ? GAS_URL.replace(/[&<>"]/g, '').slice(0, 60) + (GAS_URL.length > 60 ? '…' : '') : '(ว่าง)';
        showError(urlProblem + '<br><span style="font-size:12px;word-break:break-all;opacity:.8">ค่าที่อ่านได้: ' + shown + '</span>');
        return;
      }
      if (!navigator.onLine) {
        showError('<b>ไม่มีอินเทอร์เน็ต</b><br>เชื่อมต่อ Wi-Fi หรือเน็ตมือถือ แล้วกดลองใหม่');
        return;
      }
      splash.style.display = '';
      clearTimeout(slowTimer);
      // สำรอง: ถ้าไม่ได้รับสัญญาณใดๆ ใน 12 วินาที ให้แสดงหน้าแอปเลย (ไม่ต้องรอให้แตะจอ)
      slowTimer = setTimeout(() => navigator.onLine ? reveal() : showError('<b>ไม่มีอินเทอร์เน็ต</b><br>เชื่อมต่อแล้วกดลองใหม่'), 12000);
      if (app.src !== GAS_URL) app.src = GAS_URL; else app.contentWindow && app.contentWindow.location.replace(GAS_URL);
    }

    // สัญญาณหลัก: หน้าแอปบอกเองว่า "พร้อมแล้ว"
    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'insthink-ready') reveal();
    });
    // สัญญาณรอง: iframe โหลดเสร็จ → รออีกนิดให้แอปวาดเสร็จ แล้วแสดง
    app.addEventListener('load', () => {
      if (!app.src) return;
      clearTimeout(afterLoadTimer);
      afterLoadTimer = setTimeout(reveal, 2500);
    });
    document.getElementById('retry').addEventListener('click', load);
    window.addEventListener('online', () => { if (splash.classList.contains('error')) load(); });

    load();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
